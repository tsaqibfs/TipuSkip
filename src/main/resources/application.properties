# TipuSkip Configuration

# Database Configuration (Docker MySQL default)
db.host=localhost
db.port=3306
db.name=tipuskip_db
db.username=tipuskip_user
db.password=tipuskip_password
db.useSSL=false
db.allowPublicKeyRetrieval=true
db.serverTimezone=Asia/Jakarta

# Tess4J OCR Configuration
ocr.datapath=tessdata
ocr.language=ind+eng
ocr.enableMockFallback=true

# Application Setting
app.title=TipuSkip - Edukasi Pencegahan Penipuan Digital
app.version=1.0.0
