version: '3.8'

services:
  # MySQL Database Service
  tipuskip-mysql:
    image: mysql:8.0
    container_name: tipuskip_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: tipuskip_db
      MYSQL_USER: tipuskip_user
      MYSQL_PASSWORD: tipuskip_password
    ports:
      - "3306:3306"
    volumes:
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - tipuskip_mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    networks:
      - tipuskip-net

  # phpMyAdmin Web UI for Database Inspection (http://localhost:8085)
  tipuskip-phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: tipuskip_phpmyadmin
    restart: always
    environment:
      PMA_HOST: tipuskip-mysql
      PMA_PORT: 3306
      UPLOAD_LIMIT: 64M
    ports:
      - "8085:80"
    depends_on:
      - tipuskip-mysql
    networks:
      - tipuskip-net

networks:
  tipuskip-net:
    driver: bridge

volumes:
  tipuskip_mysql_data:
